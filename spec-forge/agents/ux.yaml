execution:
  interactive_mode: "plan_only"
  switch_to_plan_if_needed: false
  fallback_when_plan_unavailable: "stop_and_request_plan_mode"
  plan_required_reasons:
    - "skill_family_is_plan_only"
    - "missing_required_parameters"
    - "interactive_choice_required"

invocation:
  skill_name: "spec-forge"
  skill_path: "./"
  display_parameters_in_agent: true
  collect_missing_parameters_step_by_step: true
  use_choice_dialogs_when_available: true
  allow_numbered_menu_fallback: true
  summarize_stage_content_in_chat: true
  require_language_handshake: true

parameters:
  - id: "chat_language"
    label: "Chat Language"
    description: "Language used for the assistant's chat replies."
    type: "string"
    required: true
    collection_step: 1
    collect_via: "text"
    prompt: "Which language should we use in chat? If you have no preference, I will keep the current conversation language."
  - id: "file_language"
    label: "File Language"
    description: "Language used for file artifacts written by the workflow."
    type: "string"
    required: true
    collection_step: 2
    collect_via: "text"
    prompt: "Which language should we use for file artifacts? If you have no preference, I will use English."
  - id: "target_dir"
    label: "Target Project Directory"
    description: "Project root that contains or should contain the .spec-forge collection."
    type: "path"
    required: true
    collection_step: 3
    collect_via: "text"
    prompt: "Which project directory should this spec live in?"
  - id: "spec_selection_mode"
    label: "Spec Selection Mode"
    description: "Whether to initialize a new spec or resume an existing one when the intent is ambiguous."
    type: "enum"
    required: "conditional"
    condition: "required_when_existing_specs_are_present_and_user_intent_is_ambiguous"
    collection_step: 4
    collect_via: "choice"
    prompt: "Should we initialize a new spec or resume an existing spec?"
    options:
      - value: "initialize_new_spec"
        label: "Initialize New"
        description: "Start a new spec workspace under .spec-forge/specs/."
      - value: "resume_existing_spec"
        label: "Resume Existing"
        description: "Choose one of the existing specs and continue it."
  - id: "spec_id"
    label: "Spec ID"
    description: "Stable identifier for the spec workspace. Can be inferred from a direct spec path or chosen from existing specs."
    type: "slug"
    required: "conditional"
    condition: "required_when_resuming_existing_or_when_multiple_existing_specs_make_the_target_ambiguous"
    collection_step: 5
    collect_via: "choice_or_text"
    prompt: "Which spec should we work on?"
  - id: "request_title"
    label: "Request Title"
    description: "Short title for a new spec. Used to generate a spec_id when none is provided."
    type: "string"
    required: "conditional"
    condition: "required_when_creating_a_new_spec_and_spec_id_is_not_supplied"
    collection_step: 6
    collect_via: "text"
    prompt: "What short title should we use for this spec?"
  - id: "request_summary"
    label: "Request Summary"
    description: "Short summary of the spec objective. Recommended for new specs."
    type: "string"
    required: false
    collection_step: 7
    collect_via: "text"
    prompt: "What short summary should we store for this spec?"

dialogs:
  - id: "choose-operation"
    when: "existing_specs_are_present_and_spec_selection_mode_is_missing"
    kind: "single_select"
    title: "Choose Spec Action"
    question: "Should we initialize a new spec or resume an existing one?"
  - id: "choose-existing-spec"
    when: "existing_specs_are_present_and_spec_id_is_missing_for_resume"
    kind: "single_select"
    title: "Choose Existing Spec"
    question: "Which existing spec should we continue?"
