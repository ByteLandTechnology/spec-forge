        interaction_priority: 30
        prompt: "Choose the next architecture review cluster."
        options:
          - id: "solution-shape"
            label: "Solution shape"
            description: "Overall approach, outcomes, and boundaries."
          - id: "journey-index"
            label: "Journey index"
            description: "Top-level journeys and their priorities."
          - id: "component-index"
            label: "Component index"
            description: "Top-level components and boundaries."
