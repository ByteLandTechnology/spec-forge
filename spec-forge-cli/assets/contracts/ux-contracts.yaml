        resolve:
          - "artifacts.solution_outline.solution.summary"
      - id: "journey_index"
        label: "Journey Index"
        description: "Structured list of top-level journeys that the solution must support."
        type: "yaml_list"
        prompt: "Which top-level journeys should be indexed?"
        resolve:
          - "artifacts.journey_index.items"
      - id: "component_index"
        label: "Component Index"
        description: "Structured list of top-level components and responsibilities."
        type: "yaml_list"
