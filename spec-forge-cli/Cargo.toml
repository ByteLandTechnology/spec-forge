[package]
name = "spec-forge-cli"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "Native Rust CLI for the spec-forge YAML workflow"
documentation = "https://docs.rs/spec-forge-cli"
license = "MIT"
readme = "README.md"
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "SKILL.md",
    "agents/**",
    "assets/**",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_yaml = "0.9.34"
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = "3.23.0"
